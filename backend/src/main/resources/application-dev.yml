spring:
  datasource:
    url: jdbc:h2:mem:workoutdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000

cors:
  allowed-origins: http://localhost:5173
